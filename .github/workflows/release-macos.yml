name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          npm install
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-app.txt pyinstaller pywebview uv
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          which ffmpeg
          ffmpeg -version | head -n 1

      - name: Build macOS app
        env:
          ONEFILE: '0'
          CLEAN: '1'
          SKIP_INSTALL: '1'
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          npm run build:app
      - name: Create APP and PKG packages
        id: package
        shell: bash
        run: node build_app/package_macos.mjs

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PKG: ${{ steps.package.outputs.pkg }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PKG" || ! -s "$PKG" ]]; then
            echo "Missing or empty macOS PKG: $PKG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG" --clobber
          elif ! gh release create "$TAG" "$PKG" --generate-notes --title "ZM AI TOOL $TAG"; then
            sleep 5
            gh release upload "$TAG" "$PKG" --clobber
          fi
