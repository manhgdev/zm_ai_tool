name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-app.txt

      - uses: actions/cache@v6
        with:
          path: backend/pipeline/assets/lama_fp32.onnx
          key: lama-fp32-onnx-v1

      - name: Install build tools
        run: |
          npm install
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-app.txt pyinstaller pywebview uv
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          which ffmpeg
          ffmpeg -version | head -n 1
          mkdir -p backend/pipeline/assets
          lama=backend/pipeline/assets/lama_fp32.onnx
          [ -f "$lama" ] && [ "$(stat -f%z "$lama")" -ge 200000000 ] || curl -fL --retry 3 -o "$lama" https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
          [ "$(stat -f%z "$lama")" -ge 200000000 ] || { echo "lama_fp32.onnx is truncated"; exit 1; }

      - name: Build macOS app
        env:
          ONEFILE: '0'
          CLEAN: '1'
          SKIP_INSTALL: '1'
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          npm run build:app
      - name: Create APP and PKG packages
        id: package
        shell: bash
        run: node build_app/package_macos.mjs

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PKG: ${{ steps.package.outputs.pkg }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PKG" || ! -s "$PKG" ]]; then
            echo "Missing or empty macOS PKG: $PKG" >&2
            exit 1
          fi
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | sed -n '2p' || true)
          RANGE="${PREV_TAG:+$PREV_TAG..}$TAG"
          NOTES=$(git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -v '^chore: release' \
            | sed 's/^feat: /🚀 /; s/^fix: /🐛 /; s/^chore: /🔧 /; s/^perf: /⚡ /; s/^refactor: /♻️ /; s/^docs: /📝 /; s/^test: /✅ /' \
            | awk '{print "- " $0}' \
            || echo '- Cải tiến và sửa lỗi')
          BODY=$(printf '## Thay đổi trong %s\n\n%s\n\n## Kiểm tra\n\nBản phát hành được build và xác minh bởi GitHub Actions.' "$TAG" "$NOTES")
          # Create metadata separately: another platform may create the release first.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --notes "$BODY" --title "ZM AI TOOL $TAG" || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "$PKG" --clobber
