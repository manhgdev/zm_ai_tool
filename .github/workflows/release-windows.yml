name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      audit_release:
        description: 'Chẩn đoán Setup đã phát hành, không publish / Diagnose an existing Setup without publishing'
        type: string
        default: ''
      security_audit:
        description: Run the full Defender/SBOM audit explicitly
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      - 'action/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_release != ''
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test diagnostic failure reporting
        shell: pwsh
        run: ./tests/test_windows_release_diagnostic.ps1
      - name: Enable on-demand scans on the disposable hosted runner
        continue-on-error: true
        shell: pwsh
        run: ./scripts/prepare-windows-defender.ps1 -Output build_app/windows-diagnostic
      - name: Diagnose published Windows Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RELEASE: ${{ inputs.audit_release }}
        run: ./scripts/diagnose-windows-release.ps1 -ReleaseTag $env:AUDIT_RELEASE -Repository $env:GITHUB_REPOSITORY -Output build_app/windows-diagnostic
      - name: Save Windows diagnosis (including failures)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-diagnostic
          path: build_app/windows-diagnostic/
          if-no-files-found: error

  build:
    if: inputs.audit_release == ''
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-app.txt

      - uses: actions/cache@v6
        with:
          path: backend/pipeline/assets/lama_fp32.onnx
          key: lama-fp32-onnx-v1

      - name: Install build tools
        shell: pwsh
        run: |
          npm install
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements-app.txt pyinstaller pywebview uv==0.12.15 pythonnet
          function Find-RealFfmpegDir {
            $roots = @(
              (Join-Path $PWD 'build_app/.tools/ffmpeg'),
              'C:\ProgramData\chocolatey\lib\ffmpeg\tools'
            )
            foreach ($root in $roots) {
              if (-not (Test-Path -LiteralPath $root)) { continue }
              $hit = Get-ChildItem -LiteralPath $root -Recurse -File -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.Length -ge 2000000 } |
                Select-Object -First 1
              if ($hit) { return $hit.DirectoryName }
            }
            $cmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if ($cmd -and (Test-Path -LiteralPath $cmd.Source) -and ((Get-Item -LiteralPath $cmd.Source).Length -ge 2000000)) {
              return (Split-Path -Parent $cmd.Source)
            }
            return $null
          }
          $ffmpegDir = Find-RealFfmpegDir
          if (-not $ffmpegDir) {
            for ($i = 1; $i -le 3; $i++) {
              choco install ffmpeg -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds (5 * $i)
            }
            'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $ffmpegDir = Find-RealFfmpegDir
          }
          if (-not $ffmpegDir) {
            # Chocolatey feed is often 503; fall back to Gyan essentials zip.
            $tools = Join-Path $PWD 'build_app/.tools'
            New-Item -ItemType Directory -Force $tools | Out-Null
            $zip = Join-Path $tools 'ffmpeg-release-essentials.zip'
            curl.exe -fL --retry 3 --retry-delay 2 -o $zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dest = Join-Path $tools 'ffmpeg'
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
            Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
            $ffmpegDir = Find-RealFfmpegDir
          }
          if (-not $ffmpegDir) { throw 'Real ffmpeg.exe (>=2MB) was not installed' }
          $ffmpegDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            'C:\Program Files (x86)\Inno Setup 6' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          New-Item -ItemType Directory -Force backend/pipeline/assets | Out-Null
          $lama = 'backend/pipeline/assets/lama_fp32.onnx'
          if ((Test-Path $lama) -and ((Get-Item $lama).Length -lt 200000000)) { Remove-Item $lama -Force }
          if (-not (Test-Path $lama)) {
            curl.exe -fL --retry 3 -o $lama https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ((Get-Item $lama).Length -lt 200000000) { throw 'lama_fp32.onnx is truncated' }
          backend/.venv/Scripts/python.exe scripts/lama_smoke.py $lama
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test GPU fallback and OpenCV runtime
        shell: pwsh
        env:
          PYTHONPATH: backend
        run: |
          backend/.venv/Scripts/python.exe -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          backend/.venv/Scripts/python.exe -m pytest tests/test_gpu_fallback.py tests/test_runtime_cv2.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows driver launch and audit guards
        shell: pwsh
        env:
          PYTHONPATH: backend
        run: |
          backend/.venv/Scripts/python.exe -m unittest discover -s tests -p test_nvidia_driver_launch.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          backend/.venv/Scripts/python.exe -m unittest discover -s tests -p test_system_tts_windows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/test_windows_release_audit.ps1

      - name: Build EXE
        shell: pwsh
        env:
          BUILD_INSTALLER: '0'
        run: |
          npm run build:app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = Join-Path $PWD "build_app/release/ZM_AI_TOOL_v$version/ZM AI TOOL.exe"
          foreach ($check in @('runtime-import', 'yt-dlp-version')) {
            $report = Join-Path $env:RUNNER_TEMP "$check.json"
            $process = Start-Process -FilePath $exe -ArgumentList @("--$check-check", "`"$report`"") -PassThru
            if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw "$check timed out" }
            $process.Refresh()
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw "$check failed: $($process.ExitCode)" }
          }

      - name: Create release package
        id: package
        shell: pwsh
        run: |
          node build_app/package_windows.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check bundled imaging stack and LaMa model
        shell: pwsh
        env:
          BUNDLE: ${{ steps.package.outputs.directory }}
        run: |
          $missing = @()
          foreach ($leaf in @('_multiarray_umath*.pyd', 'cv2*.pyd', '_imaging*.pyd', 'onnxruntime_pybind11_state*.pyd', 'lama_fp32.onnx')) {
            $hit = Get-ChildItem -LiteralPath $env:BUNDLE -Recurse -File -Filter $leaf -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { $missing += $leaf }
          }
          if ($missing) { throw "Bundle is missing: $($missing -join ', ')" }

      - name: Check release files exist
        shell: pwsh
        env:
          INSTALLER: ${{ steps.package.outputs.installer }}
        run: |
          foreach ($file in @($env:INSTALLER)) {
            if (-not $file -or -not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release artifact: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Empty release artifact: $file"
            }
          }

      - name: Record release hashes
        shell: pwsh
        env:
          INSTALLER: ${{ steps.package.outputs.installer }}
        run: |
          New-Item -ItemType Directory -Force build_app/windows-audit | Out-Null
          $assets = @($env:INSTALLER) | ForEach-Object {
            @{ name = (Split-Path $_ -Leaf); sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ assets = @($assets) } | ConvertTo-Json -Depth 4 | Set-Content build_app/windows-audit/windows-artifact-manifest.json -Encoding utf8

      - name: Enable on-demand scans for the explicit audit
        if: inputs.security_audit == true
        continue-on-error: true
        shell: pwsh
        run: ./scripts/prepare-windows-defender.ps1 -Output build_app/windows-audit

      - name: Inventory and scan Windows release
        if: inputs.security_audit == true
        shell: pwsh
        env:
          INSTALLER: ${{ steps.package.outputs.installer }}
          BUNDLE: ${{ steps.package.outputs.directory }}
        run: |
          backend/.venv/Scripts/python.exe scripts/windows_release_audit.py --bundle "$env:BUNDLE" --installer "$env:INSTALLER" --output build_app/windows-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/audit-windows-release.ps1 -Bundle $env:BUNDLE -Installer $env:INSTALLER -Output build_app/windows-audit

      - name: Check native desktop and TTS with Defender status
        if: inputs.security_audit == true
        shell: pwsh
        env:
          BUNDLE: ${{ steps.package.outputs.directory }}
        run: ./scripts/check-windows-desktop.ps1 -Exe "$env:BUNDLE/ZM AI TOOL.exe" -Output build_app/windows-audit -CheckSystemTts -CheckVieNeu

      - name: Save audit diagnostics (including failures)
        if: always() && inputs.security_audit == true
        uses: actions/upload-artifact@v6
        with:
          name: windows-security-audit
          path: build_app/windows-audit/
          if-no-files-found: warn

      - name: Save manual Windows build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-build
          path: ${{ steps.package.outputs.installer }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/action/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          INSTALLER: ${{ steps.package.outputs.installer }}
        shell: bash
        run: |
          set -euo pipefail
          for file in "$INSTALLER"; do
            if [[ -z "$file" || ! -s "$file" ]]; then
              echo "Missing or empty Windows artifact: $file" >&2
              exit 1
            fi
          done

          # Build bullet-point release notes from commits since previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | sed -n '2p' || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$TAG"
          else
            RANGE="$TAG"
          fi

          NOTES=$(git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -v '^chore: release' \
            | sed 's/^feat: /🚀 /; s/^fix: /🐛 /; s/^chore: /🔧 /; s/^perf: /⚡ /; s/^refactor: /♻️ /; s/^docs: /📝 /; s/^test: /✅ /' \
            | awk '{print "- " $0}' \
            || echo '- Cải tiến và sửa lỗi')

          INSTALLER_BASE=$(basename "$INSTALLER")

          BODY=$(printf '## Tải về / Downloads — ZM AI TOOL %s\n\n- 📦 **Bản Cài đặt / Installer:** `%s` (Wizard, shortcut Desktop & Start Menu, hỗ trợ gỡ cài đặt / includes shortcuts and uninstall support)\n\n## Thay đổi / Changes — %s\n\n%s' \
            "$TAG" "$INSTALLER_BASE" "$TAG" "$NOTES")

          # Create metadata separately: another platform may create the release first.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --notes "$BODY" --title "ZM AI TOOL $TAG" || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "$INSTALLER" --clobber

      - name: Verify published asset digests
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/action/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content build_app/windows-audit/windows-artifact-manifest.json -Raw | ConvertFrom-Json
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($item in $manifest.assets) {
            $remote = @($release.assets | Where-Object name -eq $item.name)
            if ($remote.Count -ne 1 -or $remote[0].digest -ne ('sha256:' + $item.sha256)) { throw "Published artifact digest mismatch: $($item.name)" }
          }
