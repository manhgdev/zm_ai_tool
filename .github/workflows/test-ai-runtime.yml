name: Test Windows AI profile (manual)
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [cpu, directml, nvidia-cu124, nvidia-cu128]
        default: cpu
      runner:
        description: Use a registered Windows GPU runner for CUDA/DirectML inference
        type: choice
        options: [windows-latest, windows-ai-gpu]
        default: windows-latest
      demucs:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - run: python -m pip install uv==0.8.22 -r backend/requirements-app.txt
      - name: Install and probe selected profile
        shell: pwsh
        env:
          PYTHONPATH: backend
          TEST_PROFILE: ${{ inputs.profile }}
          TEST_DEMUCS: ${{ inputs.demucs }}
        run: |
          $env:ZM_AI_TOOL_HOME = Join-Path $env:RUNNER_TEMP ('ZM AI #TOOL ' + [guid]::NewGuid())
          $script = @'
          import os, sys
          from unittest.mock import patch
          import pipeline.core.system_check.install as sc
          sc._install_log_fn = lambda text: print(text, end='', flush=True)
          from pipeline.core.runtime_install import install_runtime, detect_profile, RuntimeInstallError
          profile = os.environ['TEST_PROFILE']
          assert profile == 'cpu' or detect_profile() == profile, 'Runner hardware does not match selected profile'
          patch('pipeline.core.runtime_install.detect_profile', return_value=profile).start()
          try:
              print(install_runtime(lambda value, message, fields: print(value, fields, flush=True), demucs=os.environ['TEST_DEMUCS'] == 'true'))
          except RuntimeInstallError as exc:
              print('\n=== INSTALL FAILED:', exc.code, exc, '===\n' + str(exc.diagnostics), flush=True)
              sys.exit(1)
          from pipeline.core.runtime_active import active_runtime_dir
          beside = active_runtime_dir() / 'Lib/site-packages/torchaudio/lib/vcomp140.dll'
          assert beside.is_file(), f'vcomp140.dll missing beside libtorchaudio.pyd: {beside}'
          print('vcomp140.dll beside torchaudio OK')
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
