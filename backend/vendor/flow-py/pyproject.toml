[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-py"
version = "0.1.0"
description = "Unofficial Python CLI & API for Google Flow AI (labs.google/fx) — bulk image/video generation automation"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["google-flow", "ai", "video-generation", "image-generation", "automation", "veo", "imagen"]
dependencies = [
    "playwright>=1.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flow*"]
